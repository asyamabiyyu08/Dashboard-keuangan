<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kas Keluarga</title>
<meta name="description" content="Pencatat dan pemantau keuangan rumah tangga: pemasukan, pengeluaran harian dan bulanan, anggaran, dan tujuan tabungan. Data tersimpan di perangkat Anda.">
<meta name="theme-color" content="#1c5cab">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kas Keluarga">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Layout: sidebar + konten di desktop; tab bawah + tombol tambah di ponsel. Dasbor berbentuk grid kartu 12 kolom. */
:root{
  --bg:#f1f4f7; --surface:#fcfcfb; --surface-2:#f4f6f8; --ink:#0e1a26; --ink-2:#44525f; --muted:#5f6b78;
  --line:#e1e6eb; --line-2:#cbd3da; --acc:#1c5cab; --acc-h:#184f95; --acc-soft:#e5eefa; --on-acc:#ffffff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --good-ink:#006300; --good-bg:#e4f4e4;
  --warn:#fab219; --warn-ink:#7a4d00; --warn-bg:#fcefcd;
  --crit:#d03b3b; --crit-ink:#a62020; --crit-bg:#fae4e4;
  --info-ink:#1c5cab; --info-bg:#e5eefa;
  --h0:#eaf0f7; --h1:#cde2fb; --h2:#9ec5f4; --h3:#6da7ec; --h4:#256abf; --h5:#104281;
  --ht0:#0e1a26; --ht1:#0e1a26; --ht2:#0e1a26; --ht3:#0e1a26; --ht4:#ffffff; --ht5:#ffffff;
  --shadow:0 1px 2px rgba(14,26,38,.05),0 6px 20px rgba(14,26,38,.04);
  --r:14px; --r-s:10px;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1218; --surface:#151b22; --surface-2:#1b232b; --ink:#eef2f5; --ink-2:#b6c1cb; --muted:#8e9ba8;
    --line:#252f39; --line-2:#36424e; --acc:#4a93ec; --acc-h:#6aa7f0; --acc-soft:#14263d; --on-acc:#07111d;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --good-ink:#4fd04f; --good-bg:#11301a; --warn-ink:#fab219; --warn-bg:#3a2d0a; --crit-ink:#ff8d8d; --crit-bg:#3d1717;
    --info-ink:#7db4f3; --info-bg:#14263d;
    --h0:#1b232b; --h1:#184f95; --h2:#256abf; --h3:#3987e5; --h4:#6da7ec; --h5:#9ec5f4;
    --ht0:#eef2f5; --ht1:#ffffff; --ht2:#ffffff; --ht3:#07111d; --ht4:#07111d; --ht5:#07111d;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1218; --surface:#151b22; --surface-2:#1b232b; --ink:#eef2f5; --ink-2:#b6c1cb; --muted:#8e9ba8;
  --line:#252f39; --line-2:#36424e; --acc:#4a93ec; --acc-h:#6aa7f0; --acc-soft:#14263d; --on-acc:#07111d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good-ink:#4fd04f; --good-bg:#11301a; --warn-ink:#fab219; --warn-bg:#3a2d0a; --crit-ink:#ff8d8d; --crit-bg:#3d1717;
  --info-ink:#7db4f3; --info-bg:#14263d;
  --h0:#1b232b; --h1:#184f95; --h2:#256abf; --h3:#3987e5; --h4:#6da7ec; --h5:#9ec5f4;
  --ht0:#eef2f5; --ht1:#ffffff; --ht2:#ffffff; --ht3:#07111d; --ht4:#07111d; --ht5:#07111d;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
a{color:var(--acc)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
svg{display:block}
.ic{flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#app{display:grid;grid-template-columns:232px minmax(0,1fr);gap:0;max-width:1480px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.side{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:20px;padding:6px 16px 6px 0;max-height:calc(100vh - 32px)}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center}
.brand b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:11.5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:none;border-radius:10px;color:var(--ink-2);font-weight:600;cursor:pointer;text-align:left}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--acc-soft);color:var(--acc)}
.sync{margin-top:auto;display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--muted);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);margin-top:5px;flex:none}
.sync[data-s="synced"] .dot{background:var(--good)} .sync[data-s="syncing"] .dot{background:var(--warn)} .sync[data-s="error"] .dot{background:var(--crit)}
.sync b{display:block;color:var(--ink);font-weight:700;font-size:12px}

.content{min-width:0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.top-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.mnav button{border:0;background:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.mnav button:hover{background:var(--surface-2)}
.mnav .cur{min-width:132px;text-align:center;font-weight:700;padding:0 6px;border:0;background:none;width:auto;height:34px;font-size:14px}
.mnav .cur:hover{background:none}
.mnav select{border:0;background:none;font-weight:700;padding:0 4px;height:34px;cursor:pointer;max-width:150px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:8px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.pri:hover{background:var(--acc-h);border-color:var(--acc-h)}
.btn.dng{color:var(--crit-ink);border-color:var(--crit-ink)}
.btn.dng.fill{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ibtn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:9px;border:0;background:none;color:var(--ink-2);cursor:pointer}
.ibtn:hover{background:var(--surface-2);color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ch h2{font-size:15px;font-weight:800;letter-spacing:-.01em}
.ch .hint{color:var(--muted);font-size:12.5px;margin-top:1px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.hero .lbl{color:var(--ink-2);font-weight:600;font-size:13px}
.hero .big{font-size:48px;line-height:1.05;font-weight:800;letter-spacing:-.03em;margin:6px 0 4px;overflow-wrap:anywhere}
.hero .big.neg{color:var(--crit-ink)}
.hero .sub{color:var(--muted);font-size:13px}
.flow{margin-top:18px}
.flow .bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:2px}
.flow .bar i{display:block;height:100%;min-width:0}
.flow .lg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.key{display:inline-flex;align-items:center;gap:6px}
.key i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.key.ln i{height:3px;width:14px;border-radius:2px}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.tile .l{color:var(--ink-2);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.tile .v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;overflow-wrap:anywhere}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.delta.up-good,.delta.down-good{color:var(--good-ink)} .delta.up-bad,.delta.down-bad{color:var(--warn-ink)}
.delta .ic{width:12px;height:12px}

.chart{width:100%;position:relative;min-height:40px}
.chart svg text{font-family:var(--font);fill:var(--muted);font-size:11px}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .axis-l{stroke:var(--line-2);stroke-width:1}
.chart .hg line.xh{stroke:var(--line-2);stroke-width:1;opacity:0}
.chart .hg:hover line.xh{opacity:1}
.chart .bar-m{transition:opacity .12s}
.chart .hg:hover .bar-m{opacity:.8}
.chart .hit{fill:transparent;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);margin-bottom:10px}
.tblwrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px}
th{color:var(--muted);font-weight:700;font-size:12px;position:sticky;top:0;background:var(--surface)}
th:first-child,td:first-child{text-align:left}
tbody tr:hover td{background:var(--surface-2)}
tr.tot td{font-weight:800;border-top:2px solid var(--line-2)}
tr.clk{cursor:pointer}
td.neg{color:var(--crit-ink)}

.hb{display:grid;gap:10px}
.hb .row{display:grid;grid-template-columns:minmax(80px,1.1fr) minmax(0,2fr) auto;gap:10px;align-items:center;font-size:13px}
.hb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:600}
.hb .tr{height:16px;display:flex;align-items:center}
.hb .fill{height:14px;border-radius:0 4px 4px 0;background:var(--s2);min-width:2px}
.hb .vl{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.hb .vl small{color:var(--muted);font-weight:500;margin-left:6px}
.hb .row:hover .fill{filter:brightness(1.08)}

.sb{display:flex;height:28px;gap:2px}
.sb div{height:100%;border-radius:4px;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;padding-left:8px;min-width:0;overflow:hidden;white-space:nowrap}
.sb div.sp{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line-2)}
.sbl{font-size:12px;color:var(--muted);font-weight:600;margin:12px 0 6px}
.sbl:first-child{margin-top:0}

.meter{height:8px;border-radius:99px;background:var(--acc-soft);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.meter.warn i{background:var(--warn)} .meter.crit i{background:var(--crit)} .meter.good i{background:var(--good)}
.meter.tall{height:12px}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.badge .ic{width:12px;height:12px;stroke-width:2.4}
.badge.good{background:var(--good-bg);color:var(--good-ink)}
.badge.warn{background:var(--warn-bg);color:var(--warn-ink)}
.badge.crit{background:var(--crit-bg);color:var(--crit-ink)}
.badge.info{background:var(--info-bg);color:var(--info-ink)}
.badge.mut{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}

.hl{display:grid;gap:14px}
.hl .it{display:grid;gap:6px}
.hl .t{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hl .t b{font-weight:700;font-size:13.5px}
.hl .s{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12.5px;flex-wrap:wrap}

.ins{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.ins li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.ins .tx b{display:block;font-size:13.5px}
.ins .tx span{color:var(--ink-2);font-size:13px}

.lst{display:grid}
.lst .r{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.lst .r:last-child{border-bottom:0}
.lst .r:hover{background:var(--surface-2)}
.dotc{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.dotc .ic{width:17px;height:17px}
.dotc.g0{background:var(--s1)}.dotc.g1{background:var(--s2)}.dotc.g2{background:var(--s3)}.dotc.gi{background:var(--good)}
.r .m{min-width:0}
.r .m b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.r .m small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.amt.in{color:var(--good-ink)} .amt.sv{color:var(--info-ink)}
.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:14px 4px 6px;border-bottom:1px solid var(--line-2);color:var(--ink-2);font-size:12.5px;font-weight:700;position:sticky;top:0;background:var(--surface);z-index:1}
.dayh span:last-child{font-weight:600;color:var(--muted)}

.filters{display:grid;grid-template-columns:minmax(180px,2fr) repeat(4,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.fld{display:grid;gap:6px;min-width:0}
.fld>span{font-size:12.5px;font-weight:700;color:var(--ink-2)}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=month],select,textarea{width:100%;min-height:40px;padding:8px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);min-width:0}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--acc);flex:none}
.err{color:var(--crit-ink);font-size:12.5px;font-weight:600}
.help{color:var(--muted);font-size:12.5px}
.chk{display:flex;gap:10px;align-items:center;font-weight:600}
.summ{display:flex;flex-wrap:wrap;gap:8px 20px;padding:10px 12px;background:var(--surface-2);border-radius:10px;font-size:13px;margin-bottom:8px;color:var(--ink-2)}
.summ b{color:var(--ink)}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0}
.cal button,.cal .e{height:64px;border-radius:8px;border:0;padding:4px 5px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;font-size:11px}
.cal .e{background:none}
.cal button{cursor:pointer;font-weight:600}
.cal button .dn{font-size:11px;opacity:.9}
.cal button .dv{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;align-self:flex-end}
.cal button.today{outline:2px solid var(--ink);outline-offset:-2px}
.cal button.sel{outline:2px solid var(--acc);outline-offset:1px}
.hc0{background:var(--h0);color:var(--ht0)}.hc1{background:var(--h1);color:var(--ht1)}.hc2{background:var(--h2);color:var(--ht2)}.hc3{background:var(--h3);color:var(--ht3)}.hc4{background:var(--h4);color:var(--ht4)}.hc5{background:var(--h5);color:var(--ht5)}
.heatkey{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.heatkey i{width:22px;height:10px;border-radius:3px;display:inline-block}

.empty{display:grid;justify-items:center;gap:8px;text-align:center;padding:28px 12px;color:var(--ink-2)}
.empty b{font-size:15px;color:var(--ink)}
.empty p{max-width:420px;color:var(--muted)}
.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--info-bg);color:var(--ink);border:1px solid var(--line-2)}
.banner b{color:var(--info-ink)}
.banner p{font-size:13px;color:var(--ink-2);max-width:62ch}
.banner.warn{background:var(--warn-bg)}.banner.warn b{color:var(--warn-ink)}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.goal h3{font-size:15px;font-weight:800}
.goal .nums{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin:10px 0 6px;flex-wrap:wrap}
.goal .nums b{font-variant-numeric:tabular-nums}
.goal .acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.budrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.6fr) 150px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.budrow:last-child{border-bottom:0}
.budrow .nm{font-weight:600;min-width:0}
.budrow .nm small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.budrow .pg{display:grid;gap:5px;font-size:12.5px;color:var(--ink-2)}
.budrow .pg .l{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.budrow input{text-align:right}
.rules{display:flex;gap:8px;flex-wrap:wrap}
.rules .btn[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.setgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.rowline{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rowline:last-child{border-bottom:0}
.rowline .m{min-width:0;flex:1 1 200px}
.rowline .m b{display:block}
.rowline .m small{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

  if (vals.length) return sum(vals) / vals.length;
  const s = monthStats(ym); return s.out > 0 ? s.out : 0;
}
function avgMonthlyIn(ym) {
  const vals = [];
  for (let i = 0; i <= 5 && vals.length < 3; i++) { const s = monthStats(addMonths(ym, -i)); if (s.in > 0) vals.push(s.in); }
  return vals.length ? sum(vals) / vals.length : 0;
}
function refIncome(ym) { return state.meta.incomeRef > 0 ? state.meta.incomeRef : Math.round(avgMonthlyIn(ym)); }

/* ---- Mutasi transaksi ---- */
function addTx(t) {
  t.u = Date.now(); state.tx.push(t); requestPersist();
  touch({ months: [t.d.slice(0, 7)] });
  return t;
}
function updateTx(id, patch) {
  const t = state.tx.find(x => x.id === id); if (!t) return null;
  const oldM = t.d.slice(0, 7);
  Object.assign(t, patch); delete t.demo;
  if (t.t !== 'save') delete t.g;
  t.u = Math.max(Date.now(), (t.u || 0) + 1);
  touch({ months: [oldM, t.d.slice(0, 7)] });
  return t;
}
function deleteTx(id) {
  const i = state.tx.findIndex(x => x.id === id); if (i < 0) return null;
  const t = state.tx[i]; state.tx.splice(i, 1);
  state.tomb[id] = Math.max(Date.now(), (t.u || 0) + 1);
  touch({ months: [t.d.slice(0, 7)], tomb: true });
  return t;
}
function restoreTx(t) {
  const u = Math.max(Date.now(), (state.tomb[t.id] || 0) + 1);
  state.tx.push({ ...t, u });
  touch({ months: [t.d.slice(0, 7)], tomb: true });
}

/* ---- Transaksi berulang ---- */
function applyRecurring() {
  const today = todayStr(), cy = curYM(); const have = new Set(state.tx.map(t => t.id)); let added = 0;
  state.recur.forEach(r => {
    if (!r.active) return;
    let ym = r.from < addMonths(cy, -36) ? addMonths(cy, -36) : r.from;
    for (; ym <= cy; ym = addMonths(ym, 1)) {
      const d = ymd(+ym.slice(0, 4), +ym.slice(5), Math.min(r.day, daysIn(ym)));
      if (d > today) continue;
      const id = 'r_' + r.id + '_' + ym;
      if (have.has(id) || state.tomb[id]) continue;
      if (!catOf(r.cat) || catOf(r.cat).id === '?') continue;
      const t = { id, t: r.type, a: r.amount, d, c: r.cat, m: r.member, p: r.method, n: r.note, auto: true, u: Date.now() };
      if (r.type === 'save' && r.goal) t.g = r.goal;
      state.tx.push(t); have.add(id); dirty.months.add(ym); added++;
    }
  });
  if (added) { rev++; state.savedAt = Date.now(); persistLocal(); schedulePush(); }
  return added;
}
function nextDue(r, from) {
  // tanggal jatuh tempo berikutnya (>= from) untuk transaksi berulang
  let ym = from.slice(0, 7);
  for (let i = 0; i < 3; i++, ym = addMonths(ym, 1)) {
    if (ym < r.from) continue;
    const d = ymd(+ym.slice(0, 4), +ym.slice(5), Math.min(r.day, daysIn(ym)));
    if (d >= from) return d;
  }
  return null;
}

/* ---- Alokasi anggaran otomatis ---- */
function computeAutoBudgets(ref, rule, ym) {
  const pools = { kebutuhan: ref * rule.k / 100, keinginan: ref * rule.w / 100, tabungan: ref * rule.s / 100 };
  const out = {};
  GROUP_KEYS.forEach(g => {
    const cats = state.cats.filter(c => c.type !== 'in' && c.group === g);
    let pool = pools[g];
    cats.forEach(c => {
      if (c.debt) {
        let vals = [];
        for (let i = 1; i <= 6 && vals.length < 3; i++) { const v = monthStats(addMonths(ym, -i)).byCat[c.id] || 0; if (v > 0) vals.push(v); }
        if (!vals.length) { const v = monthStats(ym).byCat[c.id] || 0; if (v > 0) vals.push(v); }
        const fixed = vals.length ? Math.round(sum(vals) / vals.length / 10000) * 10000 : 0;
        if (fixed > 0) { out[c.id] = fixed; pool -= fixed; }
      }
    });
    pool = Math.max(0, pool);
    const w = cats.filter(c => !c.debt && c.w > 0), tw = sum(w, c => c.w);
    w.forEach(c => { const v = tw ? Math.round(pool * c.w / tw / 10000) * 10000 : 0; if (v > 0) out[c.id] = v; });
  });
  return out;
}

/* ============ Sinkronisasi akun (opsional, kapabilitas db) ============ */
const sync = { status: 'local', msg: '', db: null, uid: null, timer: null, retry: null, busy: false, pulling: false, lastPull: 0 };
function setSync(status, msg) {
  sync.status = status; sync.msg = msg || '';
  const label = {
    local: 'Tersimpan di perangkat ini', syncing: 'Menyinkronkan…', synced: 'Tersinkron ke akun', error: 'Sinkronisasi tertunda'
  }[status];
  let detail = msg || '';
  if (!detail) {
    if (status === 'local') detail = sync.db ? '' : (isStandalone() ? 'Disimpan otomatis di peramban ini' + (lastSaveAt ? ' (' + fmtTime(lastSaveAt) + ')' : '') + '. Buat cadangan JSON berkala di Pengaturan.' : 'Masuk ke akun Claude untuk menyinkronkan antar perangkat. Buat cadangan berkala di Pengaturan.');
    if (status === 'synced') detail = 'Data juga tersimpan di akun Anda.';
  }
  if (!lsOk && idbOk !== true) detail = (detail ? detail + ' ' : '') + 'Penyimpanan peramban tidak tersedia, ekspor cadangan secara berkala.';
  if (state && state.demo && sync.db) detail = 'Data contoh tidak disinkronkan.';
  const el = $('#sync-side'); if (el) { el.dataset.s = status; el.querySelector('b').textContent = label; el.querySelector('.txt').textContent = detail; }
  const el2 = $('#sync-set'); if (el2) { el2.dataset.s = status; el2.querySelector('b').textContent = label; el2.querySelector('.txt').textContent = detail; }
}
const clean = o => JSON.parse(JSON.stringify(o));
function refMain() { return sync.db.doc('data/users/' + sync.uid + '/main'); }

async function initSync() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') { setSync('local'); return; }
    const res = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const db = res[0], user = res[1];
    if (!db || !user || typeof user.id !== 'function') { setSync('local'); return; }
    const id = await user.id();
    if (!id) { setSync('local'); return; }
    sync.db = db; sync.uid = String(id);
    refMain(); // memvalidasi path (melempar TypeError bila id tidak sah)
    await pullAndMerge();
  } catch (e) { sync.db = null; setSync('local', 'Sinkronisasi akun tidak tersedia. Data tetap aman di perangkat ini.'); }
}

async function fetchRemote() {
  const main = await refMain().get();
  const mons = await refMain().collection('months').get();
  if (!main.exists && mons.empty) return null;
  const md = main.exists ? (main.data() || {}) : {};
  const tx = [];
  mons.docs.forEach(d => { const x = d.data(); if (x && Array.isArray(x.tx)) x.tx.forEach(t => tx.push(t)); });
  return { cfg: md.cfg || null, cfgAt: +md.cfgAt || 0, tomb: (md.tomb && typeof md.tomb === 'object') ? md.tomb : {}, tx, savedAt: +md.savedAt || 0 };
}

function markAllDirty() { dirty.cfg = true; Object.keys(C().byMonth).forEach(m => dirty.months.add(m)); }

// Menggabungkan data jarak jauh ke state saat ini. Mengembalikan true bila state lokal berubah.
function mergeRemote(r) {
  let changed = false;
  if (!r) { if (!state.demo) markAllDirty(); return false; }
  if (state.demo) {
    if (r.cfg) {
      const s = sanitize({ ...r.cfg, tx: r.tx, tomb: r.tomb, cfgAt: r.cfgAt, savedAt: r.savedAt, demo: false });
      if (s) { state = s; rev++; return true; }
    }
    return false;
  }
  if (r.cfg && r.cfgAt > (state.cfgAt || 0)) { applyCfg(r.cfg); state.cfgAt = r.cfgAt; changed = true; }
  else if ((state.cfgAt || 0) > r.cfgAt) dirty.cfg = true;
  Object.keys(r.tomb).forEach(id => { const t = +r.tomb[id]; if (t > 0 && !(state.tomb[id] >= t)) { state.tomb[id] = t; changed = true; } });
  Object.keys(state.tomb).forEach(id => { if (!(+r.tomb[id] >= state.tomb[id])) dirty.cfg = true; });
  const map = new Map(); state.tx.forEach(t => map.set(t.id, t));
  const remoteIds = new Map();
  const tmp = sanitize({ ...cfgOf(state), tx: r.tx, tomb: {}, cfgAt: 1, savedAt: 1 });
  (tmp ? tmp.tx : []).forEach(t => {
    remoteIds.set(t.id, t.u || 0);
    const l = map.get(t.id);
    if (!l || (t.u || 0) > (l.u || 0)) { map.set(t.id, t); changed = true; dirty.months.add(t.d.slice(0, 7)); if (l) dirty.months.add(l.d.slice(0, 7)); dirty.months.delete(t.d.slice(0, 7)); }
  });
  map.forEach((t, id) => { const tb = state.tomb[id]; if (tb != null && tb >= (t.u || 0)) { map.delete(id); changed = true; } });
  const merged = Array.from(map.values());
  merged.forEach(t => { const ru = remoteIds.get(t.id); if (ru == null || (t.u || 0) > ru) dirty.months.add(t.d.slice(0, 7)); });
  // bulan di server yang berisi transaksi yang sudah dihapus secara lokal perlu ditulis ulang
  remoteIds.forEach((u, id) => { if (!map.has(id)) { const t = (tmp ? tmp.tx : []).find(x => x.id === id); if (t) dirty.months.add(t.d.slice(0, 7)); } });
  state.tx = merged;
  if (changed) { rev++; state.savedAt = Math.max(state.savedAt || 0, r.savedAt || 0); }
  return changed;
}

async function pullAndMerge() {
  if (!sync.db || sync.pulling) return;
  sync.pulling = true; setSync('syncing');
  try {
    const r = await fetchRemote();
    const changed = mergeRemote(r);
    applyRecurring();
    if (changed) { persistLocal(); render(); toast('Data disinkronkan dari akun Anda'); }
    sync.lastPull = Date.now();
    if (!state.demo && (dirty.cfg || dirty.months.size)) await flush(); else setSync(state.demo ? 'local' : 'synced');
  } catch (e) { setSync('error', 'Gagal terhubung ke akun. Data tetap aman di perangkat ini, mencoba lagi nanti.'); scheduleRetry(); }
  finally { sync.pulling = false; }
}

function schedulePush() {
  if (!sync.db || state.demo) return;
  clearTimeout(sync.timer); sync.timer = setTimeout(flush, 1200);
}
function scheduleRetry() { clearTimeout(sync.retry); sync.retry = setTimeout(() => { sync.busy = false; flush(); }, 20000); }

async function flush() {
  if (!sync.db || state.demo || sync.busy) return;
  if (!dirty.cfg && !dirty.months.size) return;
  sync.busy = true; setSync('syncing');
  try {
    while (dirty.cfg || dirty.months.size) {
      const cfg = dirty.cfg, months = Array.from(dirty.months);
      dirty.cfg = false; dirty.months.clear();
      try {
        if (cfg) {
          const cutoff = Date.now() - 400 * 86400000;
          Object.keys(state.tomb).forEach(k => { if (state.tomb[k] < cutoff) delete state.tomb[k]; });
          await refMain().set(clean({ v: 1, cfg: cfgOf(state), cfgAt: state.cfgAt || 0, tomb: state.tomb, savedAt: state.savedAt || 0 }));
        }
        for (const ym of months) {
          const list = state.tx.filter(t => t.d.slice(0, 7) === ym);
          const ref = refMain().collection('months').doc(ym);
          if (list.length) await ref.set(clean({ ym, n: list.length, tx: list })); else await ref.delete();
        }
      } catch (e) {
        if (cfg) dirty.cfg = true; months.forEach(m => dirty.months.add(m));
        throw e;
      }
    }
    setSync('synced');
  } catch (e) {
    const code = e && e.code;
    if (code === 'quota_exceeded' || code === 'invalid_argument') setSync('error', 'Penyimpanan akun penuh atau data terlalu besar. Data tetap aman di perangkat ini; buat cadangan JSON.');
    else { setSync('error', 'Belum bisa menyinkronkan. Data tetap aman di perangkat ini, mencoba lagi otomatis.'); scheduleRetry(); }
  } finally { sync.busy = false; }
}

/* ============ Grafik (SVG/HTML buatan sendiri, mengikuti skala tunggal) ============ */
const chartReg = {}; // id -> {fn, data}

function barPath(x, y, w, h, r) {
  if (h <= 0) return '';
  r = Math.min(r, w / 2, h);
  return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z';
}
function axisY(sc, M, W, H, fmt) {
  let o = '';
  for (let i = 0; i <= sc.n; i++) {
    const v = sc.step * i, y = M.t + (H - M.t - M.b) * (1 - v / sc.max);
    o += '<line class="' + (i === 0 ? 'axis-l' : 'grid-l') + '" x1="' + M.l + '" x2="' + (W - M.r) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '"/>';
    o += '<text x="' + (M.l - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end">' + (fmt ? fmt(v) : compact(v)) + '</text>';
  }
  return o;
}

/* Pengeluaran harian (kolom) + batas harian */
function chartDaily(W, d) {
  const H = 230, M = { l: 46, r: 8, t: 12, b: 26 }, n = d.n;
  const pw = W - M.l - M.r, ph = H - M.t - M.b, slot = pw / n, bw = Math.max(3, Math.min(20, slot * 0.68));
  const mx = Math.max.apply(null, d.vals.concat([d.limit || 0, 1]));
  const sc = niceScale(mx * 1.04, 4);
  let o = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Grafik pengeluaran harian ' + esc(fmtMonth(d.ym)) + '">' + axisY(sc, M, W, H);
  const step = slot >= 22 ? 1 : slot >= 11 ? 2 : 5;
  for (let i = 0; i < n; i++) {
    const v = d.vals[i], x = M.l + i * slot + (slot - bw) / 2, h = ph * v / sc.max, y = M.t + ph - h;
    const day = i + 1, over = d.limit && v > d.limit;
    const rows = [{ k: 'Pengeluaran', v: rupiah(v), c: 'var(--s2)' }];
    if (d.tops[i]) rows.push({ k: 'Terbesar', v: (catOf(d.tops[i].c).name.slice(0, 22)) + ' ' + compact(d.tops[i].a) });
    if (over) rows.push({ k: 'Di atas batas harian', v: '+' + compact(v - d.limit) });
    o += '<g class="hg"><line class="xh" x1="' + (M.l + (i + .5) * slot) + '" x2="' + (M.l + (i + .5) * slot) + '" y1="' + M.t + '" y2="' + (M.t + ph) + '"/>';
    if (v > 0) o += '<path class="bar-m" d="' + barPath(+x.toFixed(1), +y.toFixed(1), +bw.toFixed(1), +h.toFixed(1), 4) + '" fill="var(--s2)"/>';
    o += '<rect class="hit" x="' + (M.l + i * slot).toFixed(1) + '" y="' + M.t + '" width="' + slot.toFixed(1) + '" height="' + (ph + M.b) + '" data-tt="' + ttAttr(fmtDateLong(d.ym + '-' + pad(day)), rows) + '"/></g>';
    if (day === 1 || (day % step === 0 && day - 1 >= step * 0.8)) {
      o += '<text x="' + (M.l + (i + .5) * slot).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle"' + (d.today === day ? ' style="font-weight:800;fill:var(--ink)"' : '') + '>' + day + '</text>';
    }
  }
  if (d.limit) {
    const y = M.t + ph * (1 - d.limit / sc.max);
    o += '<line x1="' + M.l + '" x2="' + (W - M.r) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="var(--ink-2)" stroke-width="1.5"/>';
  }
  return o + '</svg>';
}

/* Laju kumulatif vs anggaran */
function chartPace(W, d) {
  const H = 230, M = { l: 46, r: 14, t: 12, b: 26 }, n = d.n;
  const pw = W - M.l - M.r, ph = H - M.t - M.b;
  const mx = Math.max(d.budget || 0, d.cum.length ? d.cum[d.cum.length - 1] : 0, 1);
  const sc = niceScale(mx * 1.05, 4);

  const step = W / n >= 22 ? 1 : W / n >= 11 ? 2 : 5;

/* Tren: pemasukan, pengeluaran, tabungan per bulan */
function chartTrend(W, d) {
  const H = 240, M = { l: 46, r: 8, t: 12, b: 28 }, n = d.rows.length;
  const pw = W - M.l - M.r, ph = H - M.t - M.b, slot = pw / n;
  const bw = Math.max(3, Math.min(16, (slot * 0.82 - 4) / 3));
  const mx = Math.max.apply(null, d.rows.map(r => Math.max(r.in, r.out, r.save)).concat([1]));
  const sc = niceScale(mx * 1.04, 4);
  const cols = ['var(--s1)', 'var(--s2)', 'var(--s3)'];
  let o = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(d.label) + '">' + axisY(sc, M, W, H);
  d.rows.forEach((r, i) => {
    const gw = bw * 3 + 4, gx = M.l + i * slot + (slot - gw) / 2;
    const vals = [r.in, r.out, r.save];
    const rows = [{ k: 'Pemasukan', v: rupiah(r.in), c: cols[0] }, { k: 'Pengeluaran', v: rupiah(r.out), c: cols[1] }, { k: 'Tabungan', v: rupiah(r.save), c: cols[2] }, { k: 'Sisa kas', v: rupiah(r.in - r.out - r.save) }];

    vals.forEach((v, k) => { const h = ph * v / sc.max; if (v > 0) o += '<path class="bar-m" d="' + barPath(+(gx + k * (bw + 2)).toFixed(1), +(M.t + ph - h).toFixed(1), +bw.toFixed(1), +h.toFixed(1), 4) + '" fill="' + cols[k] + '"/>'; });
    o += '<rect class="hit" x="' + (M.l + i * slot).toFixed(1) + '" y="' + M.t + '" width="' + slot.toFixed(1) + '" height="' + (ph + M.b) + '" data-tt="' + ttAttr(d.full(r), rows) + '"/></g>';
    o += '<text x="' + (M.l + (i + .5) * slot).toFixed(1) + '" y="' + (H - 9) + '" text-anchor="middle"' + (r.cur ? ' style="font-weight:800;fill:var(--ink)"' : '') + '>' + esc(d.short(r)) + '</text>';
  });
  return o + '</svg>';
}

/* Bar horizontal (HTML) */
function hbars(items, total, colorVar) {
  if (!items.length) return '';
  const mx = Math.max.apply(null, items.map(i => i.v).concat([1]));
  return '<div class="hb">' + items.map(i => {
    const rows = [{ k: 'Jumlah', v: rupiah(i.v), c: colorVar || 'var(--s2)' }]; if (total > 0) rows.push({ k: 'Porsi', v: pct(i.v / total, 1) });
    if (i.budget > 0) rows.push({ k: 'Anggaran', v: rupiah(i.budget) });
    return '<div class="row" data-tt="' + ttAttr(i.name, rows) + '" tabindex="0"><span class="nm" title="' + esc(i.name) + '">' + esc(i.name) + '</span><span class="tr"><span class="fill" style="width:' + Math.max(1, i.v / mx * 100).toFixed(1) + '%;' + (colorVar ? 'background:' + colorVar : '') + '"></span></span><span class="vl">' + compact(i.v) + (total > 0 ? '<small>' + pct(i.v / total) + '</small>' : '') + '</span></div>';
  }).join('') + '</div>';
}

/* Tooltip tunggal */
const tt = { el: null };
function showTT(el, ev) {
  const raw = el.getAttribute('data-tt'); if (!raw) return hideTT();
  let d; try { d = JSON.parse(decodeURIComponent(raw)); } catch (e) { return hideTT(); }
  const t = tt.el; t.textContent = '';
  const h = document.createElement('div'); h.className = 'tt-t'; h.textContent = d.t; t.appendChild(h);
  (d.r || []).forEach(r => {
    const row = document.createElement('div'); row.className = 'tt-r';
    const k = document.createElement('span');
    if (r.c) { const i = document.createElement('i'); i.style.background = r.c; k.appendChild(i); }
    k.appendChild(document.createTextNode(r.k));
    const v = document.createElement('b'); v.textContent = r.v;
    row.appendChild(k); row.appendChild(v); t.appendChild(row);
  });
  t.style.display = 'block';
  let x, y;
  if (ev && ev.clientX != null && ev.type !== 'focusin') { x = ev.clientX; y = ev.clientY; }
  else { const b = el.getBoundingClientRect(); x = b.left + b.width / 2; y = b.top; }
  const tw = t.offsetWidth, th = t.offsetHeight;
  let left = x + 14, top = y - th - 12;
  if (left + tw > window.innerWidth - 8) left = x - tw - 14;
  if (left < 8) left = 8;
  if (top < 8) top = y + 18;
  if (top + th > window.innerHeight - 8) top = Math.max(8, window.innerHeight - th - 8);
  t.style.left = left + 'px'; t.style.top = top + 'px';
}
function hideTT() { if (tt.el) tt.el.style.display = 'none'; }

/* ============ Analisis: indikator kesehatan & saran otomatis ============ */
const ST_LABEL = { good: 'Baik', warn: 'Waspada', crit: 'Perlu perhatian', info: 'Info', na: 'Belum ada data' };
const ST_ICON = { good: 'check', warn: 'alert', crit: 'alert', info: 'info', na: 'info' };
function badge(st, text) { return '<span class="badge ' + (st === 'na' ? 'mut' : st) + '">' + ic(ST_ICON[st] || 'info', 12) + esc(text || ST_LABEL[st]) + '</span>'; }
function budgetOutTotal() { let s = 0; state.cats.forEach(c => { if (c.type === 'out') s += state.budgets[c.id] || 0; }); return s; }
function totalBudgetAll() { let s = 0; state.cats.forEach(c => { if (c.type !== 'in') s += state.budgets[c.id] || 0; }); return s; }

// Proyeksi pengeluaran akhir bulan: tagihan tetap (transaksi berulang) + rata-rata harian belanja variabel.
function projectOut(ym) {
  const S = monthStats(ym), n = S.n, el = elapsedDays(ym);
  if (ym !== curYM() || el < 1) return null;
  let fixedSoFar = 0, varSoFar = 0;
  txOfMonth(ym).forEach(t => { if (t.t !== 'out') return; if (String(t.id).indexOf('r_') === 0) fixedSoFar += t.a; else varSoFar += t.a; });
  let fixedExp = 0; state.recur.forEach(r => { if (r.active && r.type === 'out' && r.from <= ym) fixedExp += r.amount; });
  fixedExp = Math.max(fixedExp, fixedSoFar);
  return Math.round(fixedExp + varSoFar / el * n);
}
function statsUpTo(ym, days) { const r = { in: 0, out: 0, save: 0 }; txOfMonth(ym).forEach(t => { if (+t.d.slice(8) <= days) r[t.t] += t.a; }); return r; }

function healthItems(ym) {
  const S = monthStats(ym), inc = S.in, M = state.meta, items = [];
  const tgt = M.saveTarget / 100;
  { const v = inc > 0 ? S.save / inc : null; const st = v == null ? 'na' : v >= tgt ? 'good' : v >= tgt / 2 ? 'warn' : 'crit';
    items.push({ id: 'save', label: 'Rasio tabungan', value: v == null ? '–' : pct(v, 1), target: 'Target ≥ ' + pctRaw(M.saveTarget), st, fill: v == null ? 0 : clamp(v / tgt, 0, 1), v }); }
  { const lim = M.debtLimit / 100; const v = inc > 0 ? S.debt / inc : null; const st = v == null ? 'na' : v <= lim ? 'good' : v <= lim + 0.1 ? 'warn' : 'crit';
    items.push({ id: 'debt', label: 'Rasio cicilan terhadap pemasukan', value: v == null ? '–' : pct(v, 1), target: 'Batas ≤ ' + pctRaw(M.debtLimit), st, fill: v == null ? 0 : clamp(v / lim, 0, 1), v }); }
  { const ideal = 1 - tgt; const v = inc > 0 ? S.out / inc : null; const st = v == null ? 'na' : v <= ideal ? 'good' : v <= 1 ? 'warn' : 'crit';
    items.push({ id: 'out', label: 'Pengeluaran terhadap pemasukan', value: v == null ? '–' : pct(v, 1), target: 'Ideal ≤ ' + pct(ideal), st, fill: v == null ? 0 : clamp(v, 0, 1), v }); }
  { const g = state.goals.find(x => x.id === 'g_darurat'); const saved = g ? goalSaved(g) : 0; const avg = avgMonthlyOut(ym);
    const v = avg > 0 ? saved / avg : null; const tm = M.ecMonths;
    const st = v == null ? 'na' : v >= tm ? 'good' : v >= Math.min(3, tm) ? 'warn' : 'crit';
    items.push({ id: 'ec', label: 'Dana darurat', value: v == null ? '–' : (Math.round(v * 10) / 10).toString().replace('.', ',') + ' bulan', target: 'Target ' + tm + ' bulan pengeluaran', st, fill: v == null ? 0 : clamp(v / tm, 0, 1), v, saved, avg }); }
  { const v = S.out > 0 ? S.food / S.out : null;
    items.push({ id: 'food', label: 'Pangsa pengeluaran makanan', value: v == null ? '–' : pct(v, 1), target: 'Indikator kesejahteraan (Hukum Engel)', st: v == null ? 'na' : 'info', fill: 0, v, noMeter: true }); }
  return items;
}

function buildInsights(ym) {
  const S = monthStats(ym), P = monthStats(addMonths(ym, -1)), M = state.meta, out = [];
  if (!S.count) return out;
  const inc = S.in, el = elapsedDays(ym), n = S.n, tgt = M.saveTarget / 100;
  const add = (st, title, text) => out.push({ st, title, text });
  if (inc > 0 || S.out > 0) {
    if (S.net < 0) add('crit', 'Arus kas defisit', 'Pengeluaran dan tabungan melebihi pemasukan sebesar ' + rupiah(-S.net) + ' di ' + fmtMonth(ym) + '. Tinjau kategori terbesar atau tunda pengeluaran yang bukan kebutuhan.');
    else if (inc > 0) add('good', 'Arus kas positif', 'Sisa kas ' + rupiah(S.net) + ' (' + pct(S.net / inc, 0) + ' dari pemasukan). Alokasikan ke dana darurat atau tujuan agar tidak habis tanpa rencana.');
  }
  if (inc > 0) {
    const v = S.save / inc;
    if (v < tgt) add(v < tgt / 2 ? 'crit' : 'warn', 'Tabungan di bawah target', 'Rasio tabungan ' + pct(v, 1) + ', target ' + pctRaw(M.saveTarget) + '. Menyisihkan tambahan ' + rupiah(Math.max(0, Math.ceil((tgt * inc - S.save) / 1000) * 1000)) + ' akan mencapai target bulan ini.');
    else add('good', 'Target tabungan tercapai', 'Rasio tabungan ' + pct(v, 1) + ' dari pemasukan, di atas target ' + pctRaw(M.saveTarget) + '.');
    if (S.debt > 0) {
      const d = S.debt / inc, lim = M.debtLimit / 100;
      if (d > lim) add(d > lim + 0.1 ? 'crit' : 'warn', 'Cicilan melewati batas', 'Cicilan ' + pct(d, 1) + ' dari pemasukan, di atas batas ' + pctRaw(M.debtLimit) + '. Hindari utang konsumtif baru dan pertimbangkan melunasi cicilan berbunga tinggi lebih dulu.');
      else add('good', 'Cicilan masih aman', 'Cicilan ' + pct(d, 1) + ' dari pemasukan, di bawah batas ' + pctRaw(M.debtLimit) + '.');
    }
  }
  // anggaran per kategori
  const over = [], near = [];
  state.cats.forEach(c => { const b = state.budgets[c.id] || 0; if (!(b > 0) || c.type !== 'out') return; const sp = S.byCat[c.id] || 0; if (sp > b) over.push({ c, x: sp - b }); else if (sp >= b * 0.85 && !c.debt) near.push({ c, x: b - sp }); });
  over.sort((a, b) => b.x - a.x); near.sort((a, b) => a.x - b.x);
  if (over.length) add('crit', over.length + ' kategori melebihi anggaran', over.slice(0, 3).map(o => o.c.name + ' (+' + compact(o.x) + ')').join(', ') + (over.length > 3 ? ', dan ' + (over.length - 3) + ' lainnya' : '') + '.');
  if (near.length) add('warn', near.length + ' kategori hampir habis', near.slice(0, 3).map(o => o.c.name + ' (sisa ' + compact(o.x) + ')').join(', ') + '.');
  if (!totalBudgetAll()) add('info', 'Anggaran belum diatur', 'Buka menu Anggaran dan terapkan alokasi 50/30/20 agar setiap kategori punya batas.');
  // proyeksi
  const bo = budgetOutTotal();
  if (ym === curYM() && el >= 5 && el < n) {
    const proj = projectOut(ym);
    const how = 'Perkiraan dari tagihan tetap ditambah rata-rata belanja harian';
    if (bo > 0) add(proj > bo * 1.05 ? 'warn' : 'good', proj > bo * 1.05 ? 'Laju melampaui anggaran' : 'Laju sesuai anggaran', how + ': pengeluaran akhir bulan sekitar ' + rupiah(proj) + ' (anggaran ' + rupiah(bo) + ').');
    else add('info', 'Proyeksi akhir bulan', how + ': pengeluaran akhir bulan sekitar ' + rupiah(proj) + '.');
  }
  // perbandingan bulan lalu
  if (P.out > 0 && S.out > 0 && (ym < curYM() || el >= Math.min(n, 20))) {
    const ch = (S.out - P.out) / P.out;
    let best = null;
    state.cats.forEach(c => { if (c.type !== 'out') return; const dlt = (S.byCat[c.id] || 0) - (P.byCat[c.id] || 0); if (!best || dlt > best.d) best = { c, d: dlt }; });
    if (ch >= 0.15) add('warn', 'Pengeluaran naik ' + pct(ch, 0), 'Dibanding bulan lalu (' + rupiah(P.out) + ')' + (best && best.d > 0 ? ', kenaikan terbesar pada ' + best.c.name + ' (+' + compact(best.d) + ').' : '.'));
    else if (ch <= -0.1) add('good', 'Pengeluaran turun ' + pct(-ch, 0), 'Lebih hemat dibanding bulan lalu (' + rupiah(P.out) + ').');
  }
  // alokasi kebutuhan vs acuan
  if (inc > 0) {
    const k = S.grp.kebutuhan / inc * 100;
    if (k > M.rule.k + 10) add('warn', 'Porsi kebutuhan besar', 'Kebutuhan menyerap ' + pct(S.grp.kebutuhan / inc, 0) + ' pemasukan (acuan ' + M.rule.k + '%). Cek tagihan tetap dan belanja pokok yang bisa dioptimalkan.');
    const w = S.grp.keinginan / inc * 100;
    if (w > M.rule.w + 10) add('warn', 'Porsi keinginan besar', 'Keinginan menyerap ' + pct(S.grp.keinginan / inc, 0) + ' pemasukan (acuan ' + M.rule.w + '%).');
  }
  // dana darurat
  const ec = healthItems(ym).find(h => h.id === 'ec');
  if (ec && ec.st !== 'na' && ec.st !== 'good') add(ec.st, 'Dana darurat belum cukup', 'Saat ini setara ' + ec.value + ' pengeluaran, target ' + M.ecMonths + ' bulan. Kekurangan sekitar ' + rupiah(Math.max(0, Math.ceil((ec.avg * M.ecMonths - ec.saved) / 1000) * 1000)) + '.');
  // kategori terbesar
  let top = null;
  state.cats.forEach(c => { if (c.type !== 'out') return; const v = S.byCat[c.id] || 0; if (v > 0 && (!top || v > top.v)) top = { c, v }; });
  if (top && S.out > 0) add('info', 'Pengeluaran terbesar', top.c.name + ' sebesar ' + rupiah(top.v) + ' (' + pct(top.v / S.out, 0) + ' dari pengeluaran).');
  const rank = { crit: 0, warn: 1, info: 2, good: 3 };
  return out.map((o, i) => ({ ...o, i })).sort((a, b) => (rank[a.st] - rank[b.st]) || (a.i - b.i)).slice(0, 8);
}

const VIEWS = [
  ['dashboard', 'Dasbor', 'dash'], ['transaksi', 'Transaksi', 'list'], ['bulanan', 'Bulanan', 'cal'],
  ['anggaran', 'Anggaran', 'pie'], ['tujuan', 'Tujuan', 'target'], ['pengaturan', 'Pengaturan', 'sliders']
];
const VIEW_TITLE = { dashboard: 'Dasbor', transaksi: 'Transaksi', bulanan: 'Ringkasan Bulanan', anggaran: 'Anggaran', tujuan: 'Tujuan & Dana Darurat', pengaturan: 'Pengaturan' };
const MONTH_VIEWS = ['dashboard', 'transaksi', 'bulanan', 'anggaran'];

function simpleTable(head, rows, totRow) {
  return '<table><thead><tr>' + head.map(h => '<th scope="col">' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr' + (r._cls ? ' class="' + r._cls + '"' : '') + '>' + r.map((c, i) => '<td' + (typeof c === 'object' && c && c.neg ? ' class="neg"' : '') + '>' + (typeof c === 'object' && c ? c.t : c) + '</td>').join('') + '</tr>').join('') +
    (totRow ? '<tr class="tot">' + totRow.map(c => '<td>' + c + '</td>').join('') + '</tr>' : '') + '</tbody></table>';
}
function deltaHtml(cur, prev, upGood, suffix) {
  suffix = suffix || ' vs bulan lalu';
  if (!(prev > 0)) return '<span class="delta">Belum ada data pembanding</span>';
  const d = (cur - prev) / prev;
  if (Math.abs(d) < 0.005) return '<span class="delta">' + ic('check', 12) + 'Sama' + suffix.replace(/^ vs/, ' dengan') + '</span>';
  const up = d > 0, good = up === upGood;
  return '<span class="delta ' + (up ? 'up' : 'down') + '-' + (good ? 'good' : 'bad') + '">' + ic(up ? 'arrup' : 'arrdn', 12) + (up ? '+' : '−') + pct(Math.abs(d), 0) + suffix + '</span>';
}
function emptyState(title, text, btn) { return '<div class="empty">' + ic('info', 28) + '<b>' + esc(title) + '</b><p>' + esc(text) + '</p>' + (btn || '') + '</div>'; }
function catIcon(t, c) {
  const cat = typeof c === 'string' ? catOf(c) : c;
  if (t === 'in') return '<span class="dotc gi">' + ic('inc', 17) + '</span>';
  return '<span class="dotc ' + GROUP_CLS[cat.group || 'keinginan'] + '">' + ic(t === 'save' ? 'save' : 'out', 17) + '</span>';
}
function txRow(t) {
  const cat = catOf(t.c), title = t.n || cat.name;
  const sub = [t.n ? cat.name : null, memberName(t.m), methodName(t.p)].filter(Boolean).join(' · ');
  const a = t.t === 'in' ? '+' + rupiah(t.a) : t.t === 'out' ? '-' + rupiah(t.a) : rupiah(t.a);
  const g = t.g ? state.goals.find(x => x.id === t.g) : null;
  return '<button type="button" class="r" data-act="edit-tx" data-id="' + esc(t.id) + '">' + catIcon(t.t, cat) +
    '<span class="m"><b>' + esc(title) + '</b><small>' + esc(sub) + (g ? ' · ' + esc(g.name) : '') + (t.auto ? ' · otomatis' : '') + '</small></span>' +
    '<span class="amt ' + (t.t === 'in' ? 'in' : t.t === 'save' ? 'sv' : '') + '">' + esc(a) + '</span></button>';
}

/* ---------- Dasbor ---------- */
function viewDashboard() {
  const ym = ui.month, S = monthStats(ym), P = monthStats(addMonths(ym, -1)), n = S.n, el = elapsedDays(ym);
  if (!state.tx.length) return '<div class="card">' + emptyState('Belum ada transaksi', 'Catat pemasukan dan pengeluaran pertama Anda, atau lihat dulu aplikasi ini dengan data contoh.',
    '<div class="top-r"><button class="btn pri" data-act="add-tx">' + ic('plus', 16) + 'Tambah transaksi</button><button class="btn" data-act="load-demo">Lihat data contoh</button></div>') + '</div>';
  const base = Math.max(S.in, S.out + S.save, 1), sisa = Math.max(0, S.net);
  const seg = (v, col) => v > 0 ? '<i style="width:' + (v / base * 100).toFixed(2) + '%;background:' + col + '"></i>' : '';

    '<div class="flow"><div class="bar" role="img" aria-label="Pembagian pemasukan">' + seg(S.out, 'var(--s2)') + seg(S.save, 'var(--s3)') + seg(sisa, 'var(--line-2)') + '</div>' +

    '<div class="tile"><div class="l">' + ic('out', 14) + 'Pengeluaran</div><div class="v">' + rupiah(S.out) + '</div>' + deltaHtml(S.out, CP.out, false, sfx) + '</div>' +
    '<div class="tile"><div class="l">' + ic('save', 14) + 'Tabungan</div><div class="v">' + rupiah(S.save) + '</div><span class="delta">' + (S.in > 0 ? pct(S.save / S.in, 1) + ' dari pemasukan' : 'Belum ada pemasukan') + '</span></div>' +
    '<div class="tile"><div class="l">' + ic('cal', 14) + 'Rata-rata per hari</div><div class="v">' + rupiah(avg) + '</div><span class="delta">' + (proj != null ? 'Proyeksi akhir bulan ≈ ' + compact(proj) : el + ' hari berjalan') + '</span></div>' +

  // harian

  const daily = '<section class="card c8"><div class="ch"><div><h2>Pengeluaran harian</h2><div class="hint">Setiap kolom adalah satu hari di ' + esc(fmtMonth(ym)) + '</div></div>' + chartSwitch('daily') + '</div>' +
    '<div class="legend"><span class="key"><i style="background:var(--s2)"></i>Pengeluaran per hari</span>' + (limit ? '<span class="key ln"><i style="background:var(--ink-2)"></i>Batas harian ' + compact(limit) + '</span>' : '') + '</div>' +
    chartBox('daily', chartDaily, dailyData, dailyTbl) + '</section>';

  // kesehatan
  const hl = healthItems(ym).map(h => '<div class="it"><div class="t"><b>' + esc(h.label) + '</b>' + badge(h.st) + '</div>' +

    '<div class="s"><span><b style="color:var(--ink)">' + esc(h.value) + '</b></span><span>' + esc(h.target) + '</span></div></div>').join('');
  const health = '<section class="card c4"><div class="ch"><div><h2>Indikator kesehatan</h2><div class="hint">Dibandingkan target rumah tangga</div></div></div><div class="hl">' + hl + '</div></section>';

  // kategori
  const cats = state.cats.filter(c => c.type === 'out' && (S.byCat[c.id] || 0) > 0).map(c => ({ name: c.name, v: S.byCat[c.id], budget: state.budgets[c.id] || 0 })).sort((a, b) => b.v - a.v);
  let items = cats.slice(0, 8); if (cats.length > 8) items.push({ name: 'Lainnya (' + (cats.length - 8) + ' kategori)', v: sum(cats.slice(8), x => x.v) });
  const catBody = items.length ? hbars(items, S.out, 'var(--s2)') : emptyState('Belum ada pengeluaran', 'Pengeluaran per kategori muncul di sini.');
  const catCard = '<section class="card c6 pair"><div class="ch"><div><h2>Pengeluaran per kategori</h2><div class="hint">Total ' + rupiah(S.out) + '</div></div></div>' + catBody + '</section>';

  // laju
  const cum = []; let run = 0; for (let i = 0; i < el; i++) { run += S.day[i]; cum.push(run); }

  const watchHtml = watch.length ? '<div class="hl">' + watch.map(w => { const r = w.s / w.b, st = r > 1 ? 'crit' : (r >= .85 && !w.c.debt) ? 'warn' : 'good'; return '<div class="it"><div class="t"><b>' + esc(w.c.name) + '</b>' + badge(st, r > 1 ? 'Lebih ' + compact(w.s - w.b) : 'Sisa ' + compact(w.b - w.s)) + '</div><div class="meter ' + (st === 'good' ? '' : st) + '"><i style="width:' + clamp(r * 100, 0, 100).toFixed(1) + '%"></i></div><div class="s"><span>' + rupiah(w.s) + ' terpakai</span><span>' + pct(r, 0) + ' dari ' + compact(w.b) + '</span></div></div>'; }).join('') + '</div>'

  const trendTbl = simpleTable(['Bulan', 'Pemasukan', 'Pengeluaran', 'Tabungan', 'Sisa kas'], rows.map(r => [fmtMonth(r.ym), rupiah(r.in), rupiah(r.out), rupiah(r.save), { t: rupiah(r.in - r.out - r.save), neg: r.in - r.out - r.save < 0 }]));
  const trend = '<section class="card c8"><div class="ch"><div><h2>Tren 6 bulan</h2><div class="hint">Sampai ' + esc(fmtMonth(ym)) + '</div></div>' + chartSwitch('trend') + '</div>' +
    '<div class="legend"><span class="key"><i style="background:var(--s1)"></i>Pemasukan</span><span class="key"><i style="background:var(--s2)"></i>Pengeluaran</span><span class="key"><i style="background:var(--s3)"></i>Tabungan</span></div>' +
    chartBox('trend', chartTrend, trendData, trendTbl) + '</section>';

  // tagihan mendatang
  const today = todayStr(), up = [];
  state.recur.forEach(r => {
    if (!r.active || r.type === 'in') return;

    const dt = new Date(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8)), t0 = new Date(+today.slice(0, 4), +today.slice(5, 7) - 1, +today.slice(8));

}

function groupAllocHtml(ym) {

    '<div class="legend" style="margin:14px 0 0;flex-direction:column;gap:6px">' + lg + '</div>';
}

/* ---------- Transaksi ---------- */
function rangeOf(r) {
  const today = todayStr(), ym = ui.month;
  const back = d => { const dt = new Date(+today.slice(0, 4), +today.slice(5, 7) - 1, +today.slice(8) - d); return ymd(dt.getFullYear(), dt.getMonth() + 1, dt.getDate()); };
  if (r === 'month') return [ym + '-01', ym + '-31'];
  if (r === 'd7') return [back(6), today];
  if (r === 'd30') return [back(29), today];
  if (r === 'd90') return [back(89), today];
  if (r === 'year') return [ym.slice(0, 4) + '-01-01', ym.slice(0, 4) + '-12-31'];
  return ['0000-00-00', '9999-99-99'];
}
function filterTx() {
  const f = ui.f, rg = rangeOf(f.r), q = f.q.trim().toLowerCase();
  return state.tx.filter(t => {
    if (t.d < rg[0] || t.d > rg[1]) return false;
    if (f.t !== 'all' && t.t !== f.t) return false;
    if (f.c !== 'all' && t.c !== f.c) return false;
    if (f.m !== 'all' && t.m !== f.m) return false;
    if (f.p !== 'all' && t.p !== f.p) return false;
    if (q) { const s = ((t.n || '') + ' ' + catOf(t.c).name + ' ' + memberName(t.m) + ' ' + methodName(t.p)).toLowerCase(); if (s.indexOf(q) < 0) return false; }
    return true;
  }).sort((a, b) => (a.d < b.d ? 1 : a.d > b.d ? -1 : (b.u || 0) - (a.u || 0)));
}
function viewTransaksi() {

  const rangeOpts = [['month', 'Bulan terpilih'], ['d7', '7 hari terakhir'], ['d30', '30 hari terakhir'], ['d90', '90 hari terakhir'], ['year', 'Tahun terpilih'], ['all', 'Semua waktu']].map(r => opt(r[0], r[1], f.r === r[0])).join('');

    '<label class="fld"><span>Kategori</span><select id="flt-c">' + catOpts + '</select></label>' +
    '<label class="fld"><span>Anggota</span><select id="flt-m">' + opt('all', 'Semua anggota', f.m === 'all') + state.members.map(m => opt(m.id, m.name, f.m === m.id)).join('') + '</select></label>' +
    '</div><div class="top-r" style="margin-bottom:10px"><label class="fld" style="min-width:170px"><span>Metode</span><select id="flt-p">' + opt('all', 'Semua metode', f.p === 'all') + METHODS.map(m => opt(m[0], m[1], f.p === m[0])).join('') + '</select></label>' +
    '<span style="flex:1"></span><button class="btn sm" data-act="reset-filters">Atur ulang filter</button><button class="btn sm" data-act="export-csv">' + ic('down', 15) + 'Ekspor CSV</button></div>' +
    '<div id="txsum"></div><div id="txlist"></div></div>';

function renderTxList() {

/* ---------- Bulanan ---------- */
function heatStep(v, mx) { if (!(v > 0) || !(mx > 0)) return 0; const r = v / mx; return r <= .12 ? 1 : r <= .3 ? 2 : r <= .5 ? 3 : r <= .75 ? 4 : 5; }

  const yearList = Object.keys(yrs).sort();
  const rows = []; let T = { in: 0, out: 0, save: 0 };
  for (let m = 1; m <= 12; m++) { const ym = year + '-' + pad(m), s = monthStats(ym); rows.push({ ym, in: s.in, out: s.out, save: s.save, cur: ym === cy, has: s.count > 0 }); T.in += s.in; T.out += s.out; T.save += s.save; }

    rows.map(r => { const net = r.in - r.out - r.save; return '<tr class="clk" data-act="pick-month" data-ym="' + r.ym + '" tabindex="0"' + (r.ym === ui.month ? ' style="background:var(--acc-soft)"' : '') + '><td>' + (r.cur ? '<b>' + BULAN[+r.ym.slice(5) - 1] + '</b>' : BULAN[+r.ym.slice(5) - 1]) + '</td><td>' + (r.has ? rupiah(r.in) : '–') + '</td><td>' + (r.has ? rupiah(r.out) : '–') + '</td><td>' + (r.has ? rupiah(r.save) : '–') + '</td><td' + (r.has && net < 0 ? ' class="neg"' : '') + '>' + (r.has ? rupiah(net) : '–') + '</td><td>' + (r.in > 0 ? pct(r.save / r.in, 1) : '–') + '</td></tr>'; }).join('') +
    '<tr class="tot"><td>Total ' + year + '</td><td>' + rupiah(T.in) + '</td><td>' + rupiah(T.out) + '</td><td>' + rupiah(T.save) + '</td><td>' + rupiah(T.in - T.out - T.save) + '</td><td>' + (T.in > 0 ? pct(T.save / T.in, 1) : '–') + '</td></tr>' +

  const trendData = { label: 'Pemasukan, pengeluaran dan tabungan per bulan tahun ' + year, rows, short: r => BULAN_S[+r.ym.slice(5) - 1], full: r => fmtMonth(r.ym) };
  const yearTop = '<div class="card"><div class="ch"><div><h2>Ringkasan tahun ' + year + '</h2><div class="hint">Pilih baris untuk membuka bulan itu</div></div>' +
    '<label class="fld" style="min-width:120px"><span class="sr">Tahun</span><select id="sel-year">' + yearList.map(y => '<option' + (+y === year ? ' selected' : '') + '>' + y + '</option>').join('') + '</select></label></div>' +
    '<div class="legend"><span class="key"><i style="background:var(--s1)"></i>Pemasukan</span><span class="key"><i style="background:var(--s2)"></i>Pengeluaran</span><span class="key"><i style="background:var(--s3)"></i>Tabungan</span></div>' +
    chartBox('year', chartTrend, trendData, '<div></div>') + '<div class="tblwrap" style="margin-top:14px">' + tbl + '</div></div>';

  // kalender panas
  const ym = ui.month, S = monthStats(ym), first = ym + '-01', off = (dowOf(first) + 6) % 7, mx = Math.max.apply(null, S.day.concat([0]));

    const rows2 = [{ k: 'Pengeluaran', v: rupiah(v), c: 'var(--s2)' }]; if (S.dayIn[d - 1]) rows2.push({ k: 'Pemasukan', v: rupiah(S.dayIn[d - 1]), c: 'var(--s1)' }); if (S.daySave[d - 1]) rows2.push({ k: 'Tabungan', v: rupiah(S.daySave[d - 1]), c: 'var(--s3)' });

  // matriks kategori x bulan
  const catTot = state.cats.filter(c => c.type === 'out').map(c => { let t = 0; const per = []; for (let m = 1; m <= 12; m++) { const v = monthStats(year + '-' + pad(m)).byCat[c.id] || 0; per.push(v); t += v; } return { c, per, t }; }).filter(x => x.t > 0).sort((a, b) => b.t - a.t);
  let gmx = 0; catTot.forEach(x => x.per.forEach(v => { if (v > gmx) gmx = v; }));
  const mat = catTot.length ? '<table><thead><tr><th scope="col">Kategori</th>' + BULAN_S.map(b => '<th scope="col">' + b + '</th>').join('') + '<th scope="col">Total</th></tr></thead><tbody>' +
    catTot.map(x => '<tr><td>' + esc(x.c.name) + '</td>' + x.per.map(v => '<td class="hc' + heatStep(v, gmx) + '" style="text-align:right">' + (v > 0 ? compact(v) : '') + '</td>').join('') + '<td><b>' + compact(x.t) + '</b></td></tr>').join('') + '</tbody></table>' : emptyState('Belum ada pengeluaran di tahun ' + year, 'Matriks kategori per bulan muncul setelah ada transaksi.');

      return '<div class="budrow"><div class="nm">' + esc(c.name) + '<small>' + (save ? 'Tabungan' : c.debt ? 'Cicilan' : c.food ? 'Makanan' : TYPE_LABEL.out) + '</small></div><div class="pg">' + prog + '</div><label class="fld"><span class="sr">Anggaran ' + esc(c.name) + '</span><input type="text" inputmode="numeric" data-bud="' + esc(c.id) + '" value="' + (b ? fmtInt(b) : '') + '" placeholder="Anggaran" autocomplete="off"></label></div>';

function toast(msg, action, ms) {
  const box = $('#toast'); const el = document.createElement('div'); el.className = 'toast';
  const sp = document.createElement('span'); sp.textContent = msg; el.appendChild(sp);
  if (action) { const b = document.createElement('button'); b.type = 'button'; b.textContent = action.label; b.addEventListener('click', () => { action.fn(); el.remove(); }); el.appendChild(b); }

}

async function exportText(filename, text) {

  } catch (e) { if (e && e.code === 'declined') return false; }
  if (isStandalone()) {
    try {
      const blob = new Blob([text], { type: /\.csv$/.test(filename) ? 'text/csv;charset=utf-8' : 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = filename; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      toast('Berkas diunduh. Jika tidak muncul, pakai "Tampilkan teks cadangan" di Pengaturan.', null, 5000); return true;
    } catch (e) { }
  }

}

    if (m) label = 'Sebelum ' + ({ 'hapus-semua': 'hapus semua data', 'ganti-data': 'ganti data', pulihkan: 'pemulihan', impor: 'impor' }[m[2]] || m[2]) + ' · ' + fmtDay(+m[1]) + ' ' + fmtTime(+m[1]);
    else label = 'Salinan harian · ' + fmtDateLong(k.slice(5));
    rows.push('<div class="rowline"><div class="m"><b>' + esc(label) + '</b><small>' + n + ' transaksi</small></div><div class="top-r"><button type="button" class="btn sm" data-act="restore-snap" data-k="' + esc(k) + '">Pulihkan</button></div></div>');
  }
  openModal('Salinan otomatis', '<p class="help">Aplikasi menyimpan salinan harian (14 terakhir) dan salinan pengaman sebelum tindakan besar. Tersimpan hanya di peramban ini.</p>' + (rows.length ? rows.join('') : '<p class="help">Belum ada salinan otomatis.</p>'), '<button type="button" class="btn dng" data-act="clear-snaps">Hapus semua salinan</button><span class="sp"></span><button type="button" class="btn pri" data-act="close-modal">Tutup</button>', { wide: true });
}

function boot() {
  tt.el = $('#tt');
  let loaded = null; const raw = lsGet(LS_STATE);
  if (raw) {
    try { loaded = sanitize(JSON.parse(raw)); } catch (e) { loaded = null; }
    if (!loaded) lsSet(LS_STATE + '.rusak', raw); // simpan salinan bila data lokal rusak
  }
  state = loaded || demoState();
  const rawUi = lsGet(LS_UI);
  if (rawUi) { try { const u = JSON.parse(rawUi); if (VIEW_TITLE[u.view]) ui.view = u.view; if (/^\d{4}-\d{2}$/.test(u.month || '')) { ui.month = u.month; ui.year = +u.month.slice(0, 4); } } catch (e) { } }
  const h = (location.hash || '').replace('#', ''); if (VIEW_TITLE[h]) ui.view = h;
  rev++;
  applyRecurring();
  // Jangan menimpa localStorage dengan data contoh sebelum salinan IndexedDB diperiksa.
  if (!(loaded && !loaded.demo)) lsOk = lsSet(LS_STATE, JSON.stringify(state));
  else { try { lsOk = localStorage.getItem(LS_STATE) === raw; } catch (e) { lsOk = false; } }
  render();
  initSync();
  recoverFromIdb(!!loaded);
  if (isStandalone() && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { }); });
  }
}
boot();

</script>
